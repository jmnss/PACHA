[server]
headless = true
enableCORS = false
enableXsrfProtection = false
address = "0.0.0.0"
port = 8501

# Tema cyberpunk (debe coincidir con interfaz/tema.py)
[theme]
base = "dark"
primaryColor = "#ff2bd6"
backgroundColor = "#07060f"
secondaryBackgroundColor = "#110e22"
textColor = "#e6f7ff"
linkColor = "#00f0ff"
borderColor = "#2e2754"
baseRadius = "none"
font = "Rajdhani:https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Orbitron:https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap, sans-serif"
codeFont = "Share Tech Mono:https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap, monospace"

[theme.sidebar]
backgroundColor = "#0b0918"
secondaryBackgroundColor = "#1a1533"
