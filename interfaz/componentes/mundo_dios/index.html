<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Tablero del modo Dios</title>
  <style>
    :root {
      --fondo: #07060f; --superficie: #110e22; --tinta: #e6f7ff; --tinta2: #a9b8d6; --tenue: #6f7a99;
      --cian: #00f0ff; --magenta: #ff2bd6; --amarillo: #fcee0a; --violeta: #9d4bff;
    }
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; color: var(--tinta);
                 font-family: "Share Tech Mono", ui-monospace, monospace; }
    #tablero { position: relative; width: 100%; aspect-ratio: 1 / 1; cursor: none; user-select: none;
               touch-action: none; overflow: hidden; background: var(--fondo);
               border: 1px solid rgba(0,240,255,0.45); box-shadow: 0 0 22px rgba(0,240,255,0.18) inset; }
    #tablero img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
    #capa { image-rendering: pixelated; }
    .marca { position: absolute; transform: translate(-50%, -50%); pointer-events: none; font-size: 11px;
             white-space: nowrap; color: var(--tinta); text-shadow: 0 0 3px #000, 0 0 6px #000; }
    .marca::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 4px;
                     background: var(--amarillo); box-shadow: 0 0 6px var(--amarillo); vertical-align: middle; }
    .marca.evento { font-size: 20px; text-shadow: 0 0 10px var(--magenta); }
    .marca.evento::before { display: none; }
    #cursor { position: absolute; pointer-events: none; font-size: 26px; transform: translate(-50%, -50%);
              filter: drop-shadow(0 0 6px rgba(255,43,214,0.9)); display: none; }
    #mira { position: absolute; pointer-events: none; width: 34px; height: 34px; margin: -17px 0 0 -17px;
            border: 1px dashed var(--cian); border-radius: 50%; display: none; box-shadow: 0 0 8px var(--cian); }
    #rayo { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at var(--x) var(--y),
            rgba(255,255,255,0.85), rgba(255,43,214,0.35) 12%, transparent 40%); opacity: 0; }
    #rayo.activo { animation: rayo 0.6s ease-out; }
    @keyframes rayo { 0% { opacity: 1; } 100% { opacity: 0; } }
    .onda { position: absolute; pointer-events: none; border: 2px solid var(--magenta); border-radius: 50%;
            transform: translate(-50%, -50%); animation: onda 0.9s ease-out forwards; }
    @keyframes onda { from { width: 0; height: 0; opacity: 1; } to { width: 160px; height: 160px; opacity: 0; } }
    #lectura { position: absolute; left: 6px; bottom: 6px; padding: 2px 6px; font-size: 11px; color: var(--tinta2);
               background: rgba(7,6,15,0.75); border: 1px solid rgba(0,240,255,0.3); pointer-events: none; }
    #ocupado { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
               background: rgba(7,6,15,0.55); color: var(--amarillo); font-size: 15px; letter-spacing: 0.2em;
               text-shadow: 0 0 10px var(--amarillo); }
    #controles { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    button { background: rgba(0,240,255,0.06); color: var(--tinta); border: 1px solid rgba(0,240,255,0.55);
             font-family: inherit; font-size: 13px; padding: 4px 10px; cursor: pointer; }
    button:hover { box-shadow: 0 0 10px rgba(0,240,255,0.6); color: var(--cian); }
    button.primario { background: linear-gradient(90deg, var(--magenta), var(--violeta)); color: var(--fondo);
                      border: none; font-weight: 700; min-width: 74px; }
    input[type=range] { flex: 1; accent-color: var(--magenta); }
    #tiempo { min-width: 150px; text-align: right; color: var(--amarillo); font-size: 14px;
              text-shadow: 0 0 8px rgba(252,238,10,0.6); }
    @media (prefers-reduced-motion: reduce) { #rayo.activo, .onda { animation: none; } }
  </style>
</head>
<body>
  <div id="tablero">
    <img id="base" alt="Relieve del mundo" />
    <img id="capa" alt="" />
    <div id="marcas"></div>
    <div id="rayo"></div>
    <div id="mira"></div>
    <div id="cursor"></div>
    <div id="lectura">—</div>
    <div id="ocupado">⚡ SIMULANDO…</div>
  </div>
  <div id="controles">
    <button id="inicio" title="Primer cuadro">⏮</button>
    <button id="play" class="primario" title="Reproducir / pausar">▶ Play</button>
    <input id="deslizador" type="range" min="0" max="0" value="0" />
    <span id="tiempo">—</span>
  </div>
  <script>
    // Protocolo mínimo de componentes de Streamlit (mensajes al documento padre).
    const enviar = (tipo, datos) =>
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: tipo }, datos), "*");

    const $ = (id) => document.getElementById(id);
    const tablero = $("tablero"), base = $("base"), capa = $("capa"), marcas = $("marcas");
    const cursor = $("cursor"), mira = $("mira"), rayo = $("rayo"), lectura = $("lectura");
    const play = $("play"), deslizador = $("deslizador"), tiempo = $("tiempo"), ocupado = $("ocupado");
    let cuadros = [], tiempos = [], k = 0, temporizador = null, claveEvento = null, limites = null;
    let periodo = 160, imagenes = [];

    const limitar = (v) => Math.min(Math.max(v, 0), 1);
    function fraccion(ev) {
      const r = tablero.getBoundingClientRect();
      return [limitar((ev.clientX - r.left) / r.width), limitar((ev.clientY - r.top) / r.height)];
    }

    function mostrar(i) {
      if (!cuadros.length) { capa.removeAttribute("src"); tiempo.textContent = "—"; return; }
      k = Math.max(0, Math.min(i, cuadros.length - 1));
      capa.src = cuadros[k];
      deslizador.value = k;
      tiempo.textContent = tiempos[k] || "";
    }

    function detener() {
      if (temporizador) clearInterval(temporizador);
      temporizador = null;
      play.textContent = "▶ Play";
    }

    function reproducir() {
      if (!cuadros.length) return;
      if (k >= cuadros.length - 1) mostrar(0);
      play.textContent = "⏸ Pausa";
      temporizador = setInterval(() => {
        if (k >= cuadros.length - 1) { detener(); return; }
        mostrar(k + 1);
      }, periodo);
    }

    play.addEventListener("click", () => (temporizador ? detener() : reproducir()));
    $("inicio").addEventListener("click", () => { detener(); mostrar(0); });
    deslizador.addEventListener("input", () => { detener(); mostrar(parseInt(deslizador.value, 10)); });

    tablero.addEventListener("pointermove", (ev) => {
      const [x, y] = fraccion(ev);
      cursor.style.left = mira.style.left = x * 100 + "%";
      cursor.style.top = mira.style.top = y * 100 + "%";
      cursor.style.display = mira.style.display = "block";
      if (limites) {
        const [o, s, e, n] = limites;
        const lat = n - y * (n - s), lon = o + x * (e - o);
        lectura.textContent = `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? "N" : "S"}, ` +
                              `${Math.abs(lon).toFixed(4)}° ${lon >= 0 ? "E" : "O"}`;
      }
    });
    tablero.addEventListener("pointerleave", () => { cursor.style.display = mira.style.display = "none"; });

    tablero.addEventListener("pointerup", (ev) => {
      const [x, y] = fraccion(ev);
      rayo.style.setProperty("--x", x * 100 + "%");
      rayo.style.setProperty("--y", y * 100 + "%");
      rayo.classList.remove("activo"); void rayo.offsetWidth; rayo.classList.add("activo");
      const onda = document.createElement("div");
      onda.className = "onda"; onda.style.left = x * 100 + "%"; onda.style.top = y * 100 + "%";
      tablero.appendChild(onda);
      setTimeout(() => onda.remove(), 1000);
      ocupado.style.display = "flex";
      detener();
      enviar("streamlit:setComponentValue", { value: { x: x, y: y, t: Date.now() } });
    });

    function ajustarAltura() {
      enviar("streamlit:setFrameHeight", { height: Math.ceil(document.body.getBoundingClientRect().height) + 4 });
    }
    window.addEventListener("resize", ajustarAltura);
    base.addEventListener("load", ajustarAltura);

    window.addEventListener("message", (ev) => {
      if (!ev.data || ev.data.type !== "streamlit:render") return;
      const a = ev.data.args || {};
      ocupado.style.display = "none";
      if (base.getAttribute("src") !== a.base) base.setAttribute("src", a.base);
      cursor.textContent = a.herramienta || "⚡";
      limites = a.limites || null;
      periodo = a.periodo_ms || 160;
      marcas.innerHTML = "";
      (a.marcas || []).forEach((m) => {
        const d = document.createElement("div");
        d.className = "marca" + (m.evento ? " evento" : "");
        d.style.left = m.x * 100 + "%"; d.style.top = m.y * 100 + "%";
        d.textContent = m.texto;
        marcas.appendChild(d);
      });
      if (a.clave_evento !== claveEvento) {        // evento nuevo: precarga y reproduce desde el principio
        claveEvento = a.clave_evento;
        detener();
        cuadros = a.cuadros || [];
        tiempos = a.tiempos || [];
        imagenes = cuadros.map((src) => { const im = new Image(); im.src = src; return im; });
        deslizador.max = Math.max(cuadros.length - 1, 0);
        mostrar(0);
        if (cuadros.length && a.autoplay) reproducir();
      }
      ajustarAltura();
    });

    enviar("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
