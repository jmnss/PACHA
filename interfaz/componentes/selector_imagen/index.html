<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Selector de punto y cuadrante</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    #lienzo { position: relative; width: 100%; cursor: crosshair; user-select: none; touch-action: none; }
    #imagen { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    .marco {
      position: absolute; display: none; pointer-events: none; box-sizing: border-box;
      border: 2px solid #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.7), inset 0 0 0 1px #07060f;
      background: rgba(0, 240, 255, 0.10);
    }
    #arrastre { border-style: dashed; border-color: #ff2bd6; box-shadow: 0 0 10px rgba(255,43,214,0.7); }
    .cruz { position: absolute; display: none; pointer-events: none; width: 18px; height: 18px; margin: -9px 0 0 -9px; }
    .cruz::before, .cruz::after { content: ""; position: absolute; background: #fcee0a; box-shadow: 0 0 6px #fcee0a, 0 0 0 1px #07060f; }
    .cruz::before { left: 8px; top: 0; width: 2px; height: 18px; }
    .cruz::after { top: 8px; left: 0; width: 18px; height: 2px; }
  </style>
</head>
<body>
  <div id="lienzo">
    <img id="imagen" draggable="false" alt="" />
    <div id="cuadrante" class="marco"></div>
    <div id="arrastre" class="marco"></div>
    <div id="punto" class="cruz"></div>
  </div>
  <script>
    // Protocolo mínimo de componentes de Streamlit (mensajes al documento padre).
    const enviar = (tipo, datos) =>
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: tipo }, datos), "*");

    const lienzo = document.getElementById("lienzo");
    const imagen = document.getElementById("imagen");
    const cuadrante = document.getElementById("cuadrante");
    const arrastre = document.getElementById("arrastre");
    const punto = document.getElementById("punto");
    let inicio = null;

    const limitar = (v) => Math.min(Math.max(v, 0), 1);

    // Posición del puntero como fracción de la imagen (0–1), independiente del tamaño en pantalla.
    function fraccion(ev) {
      const r = imagen.getBoundingClientRect();
      return [limitar((ev.clientX - r.left) / r.width), limitar((ev.clientY - r.top) / r.height)];
    }

    function colocar(el, a, b) {
      el.style.left = Math.min(a[0], b[0]) * 100 + "%";
      el.style.top = Math.min(a[1], b[1]) * 100 + "%";
      el.style.width = Math.abs(b[0] - a[0]) * 100 + "%";
      el.style.height = Math.abs(b[1] - a[1]) * 100 + "%";
      el.style.display = "block";
    }

    function ajustarAltura() {
      enviar("streamlit:setFrameHeight", { height: Math.ceil(imagen.getBoundingClientRect().height) });
    }

    imagen.addEventListener("load", ajustarAltura);
    window.addEventListener("resize", ajustarAltura);

    lienzo.addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      lienzo.setPointerCapture(ev.pointerId);
      inicio = fraccion(ev);
      arrastre.style.display = "none";
    });

    lienzo.addEventListener("pointermove", (ev) => {
      if (inicio) colocar(arrastre, inicio, fraccion(ev));
    });

    lienzo.addEventListener("pointerup", (ev) => {
      if (!inicio) return;
      const fin = fraccion(ev);
      const a = inicio;
      inicio = null;
      enviar("streamlit:setComponentValue", {
        value: { x0: a[0], y0: a[1], x1: fin[0], y1: fin[1], t: Date.now() },
      });
    });

    window.addEventListener("message", (ev) => {
      if (!ev.data || ev.data.type !== "streamlit:render") return;
      const args = ev.data.args || {};
      if (imagen.getAttribute("src") !== args.src) imagen.setAttribute("src", args.src);
      arrastre.style.display = "none";
      if (args.cuadrante) {
        colocar(cuadrante, [args.cuadrante[0], args.cuadrante[1]], [args.cuadrante[2], args.cuadrante[3]]);
      } else {
        cuadrante.style.display = "none";
      }
      if (args.punto) {
        punto.style.left = args.punto[0] * 100 + "%";
        punto.style.top = args.punto[1] * 100 + "%";
        punto.style.display = "block";
      } else {
        punto.style.display = "none";
      }
      ajustarAltura();
    });

    enviar("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
