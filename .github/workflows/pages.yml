name: Publicar en GitHub Pages

# Cada push a main verifica, construye el sitio estático (API en el navegador con Pyodide) y lo publica.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

# Base de publicación = nombre del repositorio (https://<usuario>.github.io/<repo>/).
env:
  PAGES_BASE: /${{ github.event.repository.name }}/

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-api.txt -r requirements-preparacion.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: python -m pytest tests -q
      - run: python -m unittest modelo.clima modelo.desastres
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  construir:
    needs: verificar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-api.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: bash scripts/construir_pages.sh
      - run: npx playwright test -c playwright.pages.config.ts
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist-pages

  publicar:
    needs: construir
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
